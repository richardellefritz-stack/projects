# Deploy the calculator and its license-verification function together.
# In Netlify: set the site base directory to this folder
# (apps/freelancer-rate-reality-check), or point publish + functions
# at these paths from the repo root.

[build]
  publish = "calculator"
  functions = "calculator/netlify/functions"

[functions]
  node_bundler = "esbuild"

# Optional pretty alias for the function
[[redirects]]
  from = "/api/verify-license"
  to = "/.netlify/functions/verify-license"
  status = 200
  force = true
