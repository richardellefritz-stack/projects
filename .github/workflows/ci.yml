name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify AGENTS.md exists
        run: |
          if [ ! -f AGENTS.md ]; then
            echo "AGENTS.md is missing"
            exit 1
          fi
          echo "AGENTS.md present"
