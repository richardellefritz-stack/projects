name: P007 Provenance Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  provenance:
    name: provenance-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Zero dependencies by design — no install step, nothing to cache.
      # Full JSON Schema validation via ajv is a later, explicit operator decision.
      # Path filter removed 2026-08-25: a required check that only runs on some
      # paths leaves other PRs permanently pending. The validator is fast enough
      # to run on every PR.
      - name: Validate provenance
        run: node apps/P007-smarter-acuity/tools/validate-provenance.mjs --root .
